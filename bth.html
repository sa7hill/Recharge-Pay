<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTH Recharge</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#5b2cff,#7b4dff);
    color:white;
    padding:20px;
    border-radius:0 0 25px 25px;
}

.top{
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    background:#ffffff22;
    border:0;
    color:white;
    font-size:22px;
    width:42px;
    height:42px;
    border-radius:12px;
}

.header h2{margin:0}

.container{padding:20px}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 8px 25px #0000000d;
    margin-bottom:18px;
}

label{
    display:block;
    margin:14px 0 7px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus,select:focus{
    border-color:#6b3df5;
}

.plans{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.plan{
    border:1px solid #ddd;
    background:white;
    border-radius:14px;
    padding:14px;
    cursor:pointer;
}

.plan b{
    font-size:18px;
}

.plan small{
    display:block;
    color:#777;
    margin-top:5px;
}

.pay{
    width:100%;
    padding:16px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#5b2cff,#8a5cff);
    color:white;
    font-size:17px;
    font-weight:bold;
    margin-top:20px;
}

.msg{
    display:none;
    padding:13px;
    border-radius:12px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="header">
    <div class="top">
        <button class="back" onclick="history.back()">‹</button>
        <h2>DTH Recharge</h2>
    </div>
</div>

<div class="container">

<div class="card">

    <label>DTH Operator</label>

    <select id="operator">
        <option value="">Select DTH Operator</option>
        <option>Tata Play</option>
        <option>Airtel Digital TV</option>
        <option>Dish TV</option>
        <option>Videocon D2H</option>
        <option>Sun Direct</option>
    </select>

    <label>Customer ID</label>

    <input
        id="customer"
        type="text"
        placeholder="Enter Customer ID"
    >

    <label>Recharge Amount</label>

    <input
        id="amount"
        type="number"
        placeholder="Enter amount"
    >

</div>

<div class="card">

    <b>Popular Amounts</b>

    <div class="plans">

        <div class="plan" onclick="selectAmount(199)">
            <b>₹199</b>
            <small>Basic Pack</small>
        </div>

        <div class="plan" onclick="selectAmount(299)">
            <b>₹299</b>
            <small>Family Pack</small>
        </div>

        <div class="plan" onclick="selectAmount(399)">
            <b>₹399</b>
            <small>Entertainment</small>
        </div>

        <div class="plan" onclick="selectAmount(599)">
            <b>₹599</b>
            <small>Premium Pack</small>
        </div>

    </div>

    <button class="pay" onclick="recharge()">
        Continue
    </button>

    <div class="msg" id="msg"></div>

</div>

</div>

<script>

function selectAmount(amount){
    document.getElementById("amount").value=amount;
}

function recharge(){

    let operator=document.getElementById("operator").value;
    let customer=document.getElementById("customer").value.trim();
    let amount=document.getElementById("amount").value;
    let msg=document.getElementById("msg");

    if(!operator){
        show("Please select a DTH operator.",true);
        return;
    }

    if(customer.length<4){
        show("Please enter a valid Customer ID.",true);
        return;
    }

    if(!amount || Number(amount)<=0){
        show("Please enter a valid recharge amount.",true);
        return;
    }

    show(
        "DTH recharge request created for ₹"+amount+
        ". Actual recharge requires an authorised recharge/payment backend.",
        false
    );
}

function show(text,error){

    let msg=document.getElementById("msg");

    msg.style.display="block";

    if(error){
        msg.style.background="#fff0f0";
        msg.style.color="#c62828";
    }else{
        msg.style.background="#e9fff1";
        msg.style.color="#087532";
    }

    msg.innerText=text;
}

</script>

</body>
</html>
