<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eaf4ff,#f5edff);
    overflow:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(5px);
    z-index:-1;
}

body::before{
    width:250px;
    height:250px;
    background:#b9d9ff;
    top:-80px;
    left:-80px;
}

body::after{
    width:300px;
    height:300px;
    background:#d8c4ff;
    bottom:-120px;
    right:-100px;
}

.card{
    width:390px;
    max-width:92%;
    padding:32px 28px;
    background:rgba(255,255,255,.92);
    border-radius:28px;
    box-shadow:0 25px 60px rgba(53,86,150,.18);
    animation:enter .7s ease;
}

@keyframes enter{
    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(135deg,#287ff0,#654bea);
    box-shadow:0 12px 30px rgba(59,99,230,.3);
}

h1{
    text-align:center;
    color:#173568;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.mobile-box{
    background:#f5f8ff;
    border:1px solid #dbe5f5;
    padding:12px 15px;
    border-radius:14px;
    margin-bottom:18px;
    text-align:center;
    color:#52627a;
    font-size:14px;
}

.mobile-box strong{
    display:block;
    color:#173568;
    font-size:16px;
    margin-top:4px;
}

.input-group{
    position:relative;
    margin-bottom:17px;
}

.input-group input{
    width:100%;
    height:62px;
    padding:25px 48px 7px 48px;
    border:1.5px solid #d6dfef;
    border-radius:16px;
    outline:none;
    font-size:15px;
    color:#23395d;
    background:#fff;
    transition:.3s;
}

.input-group input:focus{
    border-color:#4389ff;
    transform:translateY(-2px);
    box-shadow:0 0 0 4px rgba(67,137,255,.13);
}

.input-icon{
    position:absolute;
    left:17px;
    top:20px;
    font-size:21px;
}

.input-label{
    position:absolute;
    left:48px;
    top:9px;
    font-size:12px;
    color:#71809b;
    pointer-events:none;
}

.eye{
    position:absolute;
    right:17px;
    top:21px;
    cursor:pointer;
    font-size:19px;
    user-select:none;
}

.reset-btn{
    width:100%;
    height:58px;
    border:0;
    border-radius:16px;
    background:linear-gradient(100deg,#168ff5,#7047e8);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(65,105,230,.25);
    transition:.25s;
}

.reset-btn:hover{
    transform:translateY(-3px);
}

.reset-btn:active{
    transform:scale(.97);
}

.reset-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
    line-height:1.4;
}

.back{
    text-align:center;
    margin-top:23px;
    font-size:14px;
    color:#64748b;
}

.back a{
    color:#3978ed;
    font-weight:bold;
    text-decoration:none;
}

.back a:hover{
    text-decoration:underline;
}

@media(max-width:480px){

    .card{
        padding:28px 20px;
        border-radius:24px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🔐</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Create a new password for your account.
    </p>


    <!-- Mobile Number -->
    <div class="mobile-box">

        Registered Mobile Number

        <strong id="mobileDisplay">
            Loading...
        </strong>

    </div>


    <form id="resetForm">

        <!-- New Password -->
        <div class="input-group">

            <span class="input-icon">🔒</span>

            <span class="input-label">
                New Password
            </span>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="4"
                autocomplete="new-password"
                required
            >

            <span
                class="eye"
                onclick="togglePassword('newPassword',this)"
            >
                👁️
            </span>

        </div>


        <!-- Confirm Password -->
        <div class="input-group">

            <span class="input-icon">🔒</span>

            <span class="input-label">
                Confirm Password
            </span>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="4"
                autocomplete="new-password"
                required
            >

            <span
                class="eye"
                onclick="togglePassword('confirmPassword',this)"
            >
                👁️
            </span>

        </div>


        <button
            type="submit"
            class="reset-btn"
            id="resetButton"
        >
            Reset Password &nbsp; →
        </button>

    </form>


    <div
        class="message"
        id="message"
    ></div>


    <div class="back">

        Remember your password?

        <a href="index.html">
            Login
        </a>

    </div>

</div>


<script>

/* =================================
   GET MOBILE NUMBER
================================= */

const mobile =
    sessionStorage.getItem("resetMobile");

const mobileDisplay =
    document.getElementById("mobileDisplay");

if(mobile){

    mobileDisplay.textContent =
        mobile;

}else{

    mobileDisplay.textContent =
        "Not available";
}


/* =================================
   SHOW / HIDE PASSWORD
================================= */

function togglePassword(inputId, eye){

    const input =
        document.getElementById(inputId);

    if(input.type === "password"){

        input.type = "text";

        eye.textContent = "🙈";

    }else{

        input.type = "password";

        eye.textContent = "👁️";
    }
}


/* =================================
   RESET PASSWORD
================================= */

document
.getElementById("resetForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const newPassword =
        document
        .getElementById("newPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;

    const message =
        document
        .getElementById("message");

    const button =
        document
        .getElementById("resetButton");


    /* Password length */

    if(newPassword.length < 4){

        message.style.color =
            "#e53935";

        message.textContent =
            "Password must be at least 4 characters.";

        return;
    }


    /* Password match */

    if(newPassword !== confirmPassword){

        message.style.color =
            "#e53935";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    /* Success */

    message.style.color =
        "#16a05d";

    message.textContent =
        "Password reset successful!";


    button.disabled = true;


    /*
      Frontend prototype only.
      Real password changes require
      a secure backend/API.
    */

    setTimeout(function(){

        sessionStorage.removeItem(
            "resetMobile"
        );

        window.location.href =
            "index.html";

    },1000);

});

</script>

</body>
</html>
