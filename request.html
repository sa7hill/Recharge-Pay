<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Request Money</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#17233d;
}

.header{
    background:linear-gradient(135deg,#147ff3,#7047e8);
    color:white;
    padding:20px 17px 28px;
    border-radius:0 0 28px 28px;
}

.top{
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:42px;
    height:42px;
    border:0;
    border-radius:13px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:23px;
}

.container{
    padding:20px 16px;
}

.card{
    background:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 7px 22px rgba(30,50,90,.08);
}

label{
    display:block;
    color:#68768c;
    font-size:12px;
    margin-bottom:7px;
}

.input{
    width:100%;
    height:54px;
    border:1px solid #dce2ec;
    border-radius:14px;
    padding:0 15px;
    outline:none;
    margin-bottom:17px;
    font-size:15px;
}

.input:focus{
    border-color:#397ff1;
    box-shadow:0 0 0 3px rgba(57,127,241,.1);
}

.amount-box{
    position:relative;
}

.amount-box span{
    position:absolute;
    left:15px;
    top:17px;
    font-size:18px;
    font-weight:bold;
    color:#66758b;
}

.amount{
    padding-left:38px;
    font-size:22px;
    font-weight:bold;
}

.request-btn{
    width:100%;
    height:55px;
    border:0;
    border-radius:14px;
    background:linear-gradient(100deg,#168ff5,#7047e8);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:15px;
    padding:14px;
    border-radius:14px;
    background:#edf9f3;
    color:#16845a;
    display:none;
    font-size:13px;
}

.requests{
    margin-top:22px;
}

.requests h3{
    margin-bottom:12px;
}

.request-item{
    background:white;
    padding:15px;
    border-radius:16px;
    margin-bottom:10px;
    box-shadow:0 4px 15px rgba(30,50,90,.06);
    display:flex;
    align-items:center;
}

.request-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#edf4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:12px;
}

.request-info{
    flex:1;
}

.request-info h4{
    font-size:13px;
}

.request-info p{
    font-size:11px;
    color:#8792a4;
    margin-top:4px;
}

.request-amount{
    font-weight:bold;
    color:#3978ed;
}
</style>
</head>

<body>

<header class="header">

    <div class="top">

        <button class="back"
                onclick="goHome()">‹</button>

        <div>
            <h2>Request Money</h2>
            <p>Create a payment request</p>
        </div>

    </div>

</header>


<div class="container">

    <div class="card">

        <label>Mobile / Account</label>

        <input
            class="input"
            id="receiver"
            type="text"
            placeholder="Enter mobile or account">

        <label>Amount</label>

        <div class="amount-box">

            <span>₹</span>

            <input
                class="input amount"
                id="amount"
                type="number"
                min="1"
                placeholder="0.00">

        </div>

        <label>Note (optional)</label>

        <input
            class="input"
            id="note"
            type="text"
            placeholder="What's this for?">

        <button
            class="request-btn"
            onclick="createRequest()">
            Create Request
        </button>

        <div class="result" id="result"></div>

    </div>


    <div class="requests">

        <h3>Recent Requests</h3>

        <div id="requestList">

            <div class="request-item">

                <div class="request-icon">
                    💸
                </div>

                <div class="request-info">
                    <h4>No requests yet</h4>
                    <p>Create a request above</p>
                </div>

                <div class="request-amount">
                    —
                </div>

            </div>

        </div>

    </div>

</div>


<script>

function goHome(){
    location.href="index.html";
}


function createRequest(){

    const receiver =
        document.getElementById("receiver")
        .value.trim();

    const amount =
        document.getElementById("amount")
        .value.trim();

    const note =
        document.getElementById("note")
        .value.trim();

    const result =
        document.getElementById("result");

    if(!receiver){

        alert("Enter a mobile number or account.");
        return;

    }

    if(!amount || Number(amount)<=0){

        alert("Enter a valid amount.");
        return;

    }

    /*
      This creates a local UI request only.
      Connect your authorised backend here
      for real payment-request processing.
    */

    result.style.display="block";

    result.textContent =
        "Request created for ₹"
        + Number(amount).toFixed(2)
        + ".";

    const list =
        document.getElementById("requestList");

    list.innerHTML="";

    const item =
        document.createElement("div");

    item.className="request-item";

    item.innerHTML=`
        <div class="request-icon">💸</div>

        <div class="request-info">
            <h4>${escapeHTML(receiver)}</h4>
            <p>${escapeHTML(note || "Payment request")}</p>
        </div>

        <div class="request-amount">
            ₹${Number(amount).toFixed(2)}
        </div>
    `;

    list.appendChild(item);

}


function escapeHTML(text){

    const div=document.createElement("div");

    div.textContent=text;

    return div.innerHTML;
}

</script>

</body>
</html>
