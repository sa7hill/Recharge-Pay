<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Create Account</title>  <style>  
*{  
    box-sizing:border-box;  
    margin:0;  
    padding:0;  
}  
  
body{  
    min-height:100vh;  
    display:flex;  
    justify-content:center;  
    align-items:center;  
    font-family:Arial,sans-serif;  
    background:linear-gradient(135deg,#eaf4ff,#f5edff);  
    overflow:hidden;  
}  
  
.register-card{  
    width:400px;  
    max-width:92%;  
    padding:30px 25px;  
    background:rgba(255,255,255,.9);  
    border-radius:28px;  
    box-shadow:0 25px 60px rgba(53,86,150,.18);  
    animation:enter .8s ease forwards,  
              floatCard 4s ease-in-out infinite;  
}  
  
@keyframes enter{  
    from{  
        opacity:0;  
        transform:translateY(45px);  
    }  
    to{  
        opacity:1;  
        transform:translateY(0);  
    }  
}  
  
@keyframes floatCard{  
    0%,100%{margin-top:0}  
    50%{margin-top:-7px}  
}  
  
.logo{  
    width:80px;  
    height:80px;  
    margin:0 auto 18px;  
    border-radius:50%;  
    display:flex;  
    justify-content:center;  
    align-items:center;  
    font-size:38px;  
    background:linear-gradient(135deg,#278cf5,#7048e8);  
    box-shadow:0 12px 30px rgba(59,99,230,.3);  
}  
  
h1{  
    text-align:center;  
    color:#173568;  
    font-size:28px;  
    margin-bottom:7px;  
}  
  
.subtitle{  
    text-align:center;  
    color:#68768e;  
    font-size:14px;  
    margin-bottom:23px;  
}  
  
.input-group{  
    position:relative;  
    margin-bottom:14px;  
}  
  
.input-group input{  
    width:100%;  
    height:59px;  
    padding:23px 15px 7px 46px;  
    border:1.5px solid #d6dfef;  
    border-radius:15px;  
    outline:none;  
    font-size:15px;  
    transition:.3s;  
}  
  
.input-group input:focus{  
    border-color:#4389ff;  
    transform:translateY(-2px);  
    box-shadow:0 0 0 4px rgba(67,137,255,.13);  
}  
  
.input-group label{  
    position:absolute;  
    top:9px;  
    left:46px;  
    font-size:11px;  
    color:#71809b;  
}  
  
.icon{  
    position:absolute;  
    left:16px;  
    top:19px;  
    font-size:19px;  
}  
  
.eye{  
    position:absolute;  
    right:16px;  
    top:20px;  
    cursor:pointer;  
}  
  
.terms{  
    display:flex;  
    gap:8px;  
    align-items:flex-start;  
    margin:17px 2px;  
    color:#68768e;  
    font-size:12px;  
    line-height:18px;  
}  
  
.terms input{  
    margin-top:2px;  
    accent-color:#397ff1;  
}  
  
.terms a{  
    color:#3978ed;  
}  
  
.register-btn{  
    width:100%;  
    height:57px;  
    border:0;  
    border-radius:15px;  
    background:linear-gradient(100deg,#168ff5,#7047e8);  
    color:white;  
    font-size:17px;  
    font-weight:bold;  
    cursor:pointer;  
    position:relative;  
    overflow:hidden;  
    transition:.25s;  
    box-shadow:0 10px 25px rgba(65,105,230,.25);  
}  
  
.register-btn:hover{  
    transform:translateY(-3px);  
    box-shadow:0 15px 30px rgba(65,105,230,.35);  
}  
  
.register-btn:active{  
    transform:scale(.97);  
}  
  
.register-btn::before{  
    content:"";  
    position:absolute;  
    top:0;  
    left:-100px;  
    width:70px;  
    height:100%;  
    background:rgba(255,255,255,.3);  
    transform:skewX(-25deg);  
    transition:.5s;  
}  
  
.register-btn:hover::before{  
    left:120%;  
}  
  
.message{  
    text-align:center;  
    min-height:18px;  
    margin-top:13px;  
    font-size:13px;  
    font-weight:bold;  
}  
  
.login-link{  
    text-align:center;  
    margin-top:21px;  
    color:#68768e;  
    font-size:14px;  
}  
  
.login-link a{  
    color:#3978ed;  
    font-weight:bold;  
    text-decoration:none;  
    cursor:pointer;  
}  
  
@media(max-width:480px){  
    .register-card{  
        padding:27px 19px;  
        border-radius:23px;  
    }  
  
    h1{  
        font-size:25px;  
    }  
}  
</style>  </head>  <body>  <div class="register-card">  <div class="logo">👤</div>  

<h1>Create Account</h1>  

<p class="subtitle">  
    Register your new account  
</p>  

<form id="registerForm">  

    <div class="input-group">  
        <span class="icon">👤</span>  
        <label>Full Name</label>  
        <input  
            type="text"  
            id="name"  
            placeholder="Enter your name"  
            required>  
    </div>  

    <div class="input-group">  
        <span class="icon">📱</span>  
        <label>Mobile Number</label>  
        <input  
            type="tel"  
            id="mobile"  
            placeholder="10-digit mobile number"  
            maxlength="10"  
            required>  
    </div>  

    <div class="input-group">  
        <span class="icon">📧</span>  
        <label>Email</label>  
        <input  
            type="email"  
            id="email"  
            placeholder="Enter your email"  
            required>  
    </div>  

    <div class="input-group">  
        <span class="icon">🔒</span>  
        <label>Password</label>  

        <input  
            type="password"  
            id="password"  
            placeholder="Create password"  
            required>  

        <span class="eye"  
              onclick="togglePassword('password',this)">  
            👁️  
        </span>  
    </div>  

    <div class="input-group">  
        <span class="icon">🔐</span>  
        <label>Confirm Password</label>  

        <input  
            type="password"  
            id="confirmPassword"  
            placeholder="Confirm password"  
            required>  

        <span class="eye"  
              onclick="togglePassword('confirmPassword',this)">  
            👁️  
        </span>  
    </div>  

    <label class="terms">  
        <input type="checkbox" id="terms">  
        <span>  
            I agree to the Terms & Conditions and Privacy Policy.  
        </span>  
    </label>  

    <button class="register-btn" type="submit">  
        Create Account →  
    </button>  

</form>  

<div class="message" id="message"></div>  

<div class="login-link">  
    Already have an account?  
    <a onclick="goLogin()">Login</a>  
</div>

</div>  <script>  
  
function togglePassword(id,element){  
  
    const input=document.getElementById(id);  
  
    if(input.type==="password"){  
        input.type="text";  
        element.textContent="🙈";  
    }else{  
        input.type="password";  
        element.textContent="👁️";  
    }  
}  
  
document.getElementById("registerForm")  
.addEventListener("submit",function(e){  
  
    e.preventDefault();  
  
    const name=document.getElementById("name").value.trim();  
    const mobile=document.getElementById("mobile").value.trim();  
    const email=document.getElementById("email").value.trim();  
    const password=document.getElementById("password").value;  
    const confirm=document.getElementById("confirmPassword").value;  
    const terms=document.getElementById("terms").checked;  
  
    const message=document.getElementById("message");  
  
    if(name.length<2){  
        message.style.color="#e53935";  
        message.textContent="Please enter your full name.";  
        return;  
    }  
  
    if(!/^[0-9]{10}$/.test(mobile)){  
        message.style.color="#e53935";  
        message.textContent="Enter a valid 10-digit mobile number.";  
        return;  
    }  
  
    if(!email.includes("@")){  
        message.style.color="#e53935";  
        message.textContent="Enter a valid email address.";  
        return;  
    }  
  
    if(password.length<6){  
        message.style.color="#e53935";  
        message.textContent="Password must contain at least 6 characters.";  
        return;  
    }  
  
    if(password!==confirm){  
        message.style.color="#e53935";  
        message.textContent="Passwords do not match.";  
        return;  
    }  
  
    if(!terms){  
        message.style.color="#e53935";  
        message.textContent="Please accept the Terms & Conditions.";  
        return;  
    }  
  
    message.style.color="#16a05d";  
    message.textContent="Registration successful!";  
  
});  
  
function goLogin(){  
  
    // Agar login page ka naam index.html hai  
    window.location.href="index.html";  
  
}  
  
</script>  </body>  
</html>
