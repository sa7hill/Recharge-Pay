<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eaf4ff,#f5edff);
    overflow:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(5px);
    z-index:-1;
}

body::before{
    width:250px;
    height:250px;
    background:#b9d9ff;
    top:-80px;
    left:-80px;
}

body::after{
    width:300px;
    height:300px;
    background:#d8c4ff;
    bottom:-120px;
    right:-100px;
}

.card{
    width:390px;
    max-width:92%;
    padding:32px 28px;
    background:rgba(255,255,255,.9);
    border-radius:28px;
    box-shadow:0 25px 60px rgba(53,86,150,.18);
    animation:enter .7s ease;
}

@keyframes enter{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(135deg,#287ff0,#654bea);
    box-shadow:0 12px 30px rgba(59,99,230,.3);
}

h1{
    text-align:center;
    color:#173568;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.5;
    margin-bottom:26px;
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    height:62px;
    padding:25px 16px 7px 48px;
    border:1.5px solid #d6dfef;
    border-radius:16px;
    outline:none;
    font-size:15px;
    color:#23395d;
    background:#fff;
    transition:.3s;
}

.input-group input:focus{
    border-color:#4389ff;
    transform:translateY(-2px);
    box-shadow:0 0 0 4px rgba(67,137,255,.13);
}

.input-icon{
    position:absolute;
    left:17px;
    top:20px;
    font-size:21px;
}

.input-group label{
    position:absolute;
    left:48px;
    top:9px;
    font-size:12px;
    color:#71809b;
}

.reset-btn{
    width:100%;
    height:58px;
    border:0;
    border-radius:16px;
    background:linear-gradient(100deg,#168ff5,#7047e8);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(65,105,230,.25);
    transition:.25s;
}

.reset-btn:hover{
    transform:translateY(-3px);
}

.reset-btn:active{
    transform:scale(.97);
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:16px;
    font-size:14px;
    font-weight:bold;
}

.back{
    text-align:center;
    margin-top:24px;
    font-size:14px;
    color:#64748b;
}

.back a{
    color:#3978ed;
    font-weight:bold;
    text-decoration:none;
}

@media(max-width:480px){
    .card{
        padding:28px 20px;
        border-radius:24px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🔑</div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your registered mobile number to continue.
    </p>

    <form id="forgotForm">

        <div class="input-group">

            <span class="input-icon">📱</span>

            <label>Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
                inputmode="numeric"
                required
            >

        </div>

        <button class="reset-btn" type="submit">
            Continue &nbsp; →
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="back">
        Remember your password?
        <a href="index.html">Login</a>
    </div>

</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(e){

    e.preventDefault();

    const mobile =
        document.getElementById("mobile").value.trim();

    const message =
        document.getElementById("message");

    if(!/^[0-9]{10}$/.test(mobile)){

        message.style.color = "#e53935";

        message.textContent =
            "Enter a valid 10-digit mobile number.";

        return;
    }

    message.style.color = "#3978ed";

    message.textContent =
        "Mobile number verified. Password reset can continue.";

});
</script>

</body>
</html>
